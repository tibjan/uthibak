<!DOCTYPE html><html lang="hu"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Úthibák</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#666;--card:#f3f4f6;--bd:#d0d4da;--ac:#1d4ed8}
@media (prefers-color-scheme:dark){:root{--bg:#15171a;--fg:#eee;--mut:#9aa0a6;--card:#23262b;--bd:#3a3f46;--ac:#4f7df0}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif}
#map{height:55vh;min-height:300px}
main{padding:12px;max-width:820px;margin:auto}
h2{font-size:16px;margin:18px 0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:8px}.row>label{flex:1;min-width:110px;font-size:12px;color:var(--mut)}
input,button,.btn{font:inherit;width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg)}
button,.btn{background:var(--ac);color:#fff;border:0;cursor:pointer;font-weight:600;text-align:center;display:block}
.s{background:var(--card)!important;color:var(--fg)!important;border:1px solid var(--bd)!important}
.row>.b{flex:1;min-width:150px}
.stats{display:flex;gap:8px}.stats div{flex:1;background:var(--card);border-radius:10px;padding:10px;text-align:center}.stats b{display:block;font-size:20px}
.leg{height:10px;border-radius:5px;background:linear-gradient(90deg,hsl(220,80%,50%),hsl(110,80%,50%),hsl(0,80%,50%));margin:8px 0 2px}
.lg{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:5px 4px;border-bottom:1px solid var(--bd);text-align:right}td:first-child,th:first-child{text-align:left}
.bar{height:6px;background:var(--ac);border-radius:3px}.tw{overflow-x:auto}
@media print{#tools{display:none}}
</style></head><body>
<div id="map"></div>
<main>
<div class="row"><button class="b s" id="m1">Egy időszak (színátmenet)</button><button class="b s" id="m2">Két időszak összehasonlítása</button></div>
<div id="p1"><div class="row"><label>Kezdő dátum<input type="date" id="from"></label><label>Záró dátum<input type="date" id="to"></label></div>
<div class="leg"></div><div class="lg"><span id="l1"></span><span>régebbi → újabb</span><span id="l2"></span></div></div>
<div id="p2" style="display:none">
<div class="row"><label style="color:#2563eb;font-weight:700">● A időszak kezdő dátum<input type="date" id="af"></label><label style="color:#2563eb;font-weight:700">A időszak záró dátum<input type="date" id="at"></label></div>
<div class="row"><label style="color:#dc2626;font-weight:700">● B időszak kezdő dátum<input type="date" id="bf"></label><label style="color:#dc2626;font-weight:700">B időszak záró dátum<input type="date" id="bt"></label></div>
<div id="warn" style="color:#b45309;font-size:13px"></div></div>
<h2 id="sumh">Összesítés</h2>
<div class="stats" id="stats"><div><b id="n">0</b>úthiba</div><div><b id="v">0</b>m³ összesen</div></div>
<div id="dayw"><h2>Napi bontás</h2><div class="tw"><table id="days"></table></div></div>
<div id="cmpw" style="display:none"><h2>Összehasonlítás</h2><div class="tw"><table id="cmp"></table></div>
<h2>Utcánként (m³)</h2><div class="tw"><table id="st"></table></div></div>
<div id="tools">
<h2>Új úthiba rögzítése</h2>
<div class="row"><label>Dátum<input type="date" id="d"></label><label>GPS (szél, hossz)<input id="g" placeholder="46.98, 17.69"></label></div>
<div class="row"><button class="s" id="gps">📍 Helyzet lekérése</button></div>
<div class="row"><label>Utca<input id="u"></label><label>Hossz (cm)<input type="number" id="h" inputmode="decimal"></label><label>Szél. (cm)<input type="number" id="w" inputmode="decimal"></label><label>Mély. (cm)<input type="number" id="m" value="4" inputmode="decimal"></label></div>
<div class="row"><label>Megjegyzés<input id="c"></label></div>
<div class="row"><button id="add">Mentés</button></div>
<h2>Adatok kezelése</h2>
<div class="row"><label class="btn b s" style="margin:0">📂 CSV betöltése / összefésülése<input type="file" id="imp" accept=".csv,text/csv,text/plain" multiple hidden></label>
<button class="b s" id="exp">⬇ Teljes táblázat letöltése (CSV)</button></div>
<div class="row"><button class="b s" id="undo">Utolsó rögzítés törlése</button><button class="b s" id="clr">Minden adat törlése</button></div>
<p id="msg" style="color:var(--mut);font-size:13px"></p>
</div>
</main>

"note": ""}, {"date": "2026-02-25", "lat": 46.982214, "lng": 17.697586, "street": "Kinizsi", "h": 100.0, "w": 100.0, "d": 4.0, "note": ""}, {"date": "2026-02-25", "lat": 46.980252, "lng": 17.696471, "street": "Iskola", "h": 80.0, "w": 60.0, "d": 4.0, "note": ""}, {"date": "2026-02-25", "lat": 46.980479, "lng": 17.695972, "street": "Iskola", "h": 180.0, "w": 50.0, "d": 4.0, "note": ""}, {"date": "2026-02-25", "lat": 46.981599, "lng": 17.693549, "street": "Iskola", "h": 100.0, "w": 40.0, "d": 4.0, "note": ""}, {"date": "2026-02-25", "lat": 46.98171, "lng": 17.693302, "street": "Iskola", "h": 150.0, "w": 60.0, "d": 4.0, "note": ""}, {"date": "2026-02-25", "lat": 46.981795, "lng": 17.693125, "street": "Óvoda", "h": 60.0, "w": 50.0, "d": 4.0, "note": ""}, {"date": "2026-02-25", "lat": 46.982806, "lng": 17.691945, "street": "Óvoda", "h": 40.0, "w": 30.0, "d": 4.0, "note": ""}, {"date": "2026-02-25", "lat": 46.981017, "lng": 17.694618, "street": "Iskola", "h": 90.0, "w": 30.0, "d": 4.0, "note": ""}, {"date": "2026-02-25", "lat": 46.980867, "lng": 17.694951, "street": "Iskola", "h": 310.0, "w": 30.0, "d": 4.0, "note": ""}];
const $=i=>document.getElementById(i);
let rows=null;try{const s=localStorage.getItem('uthibak');if(s)rows=JSON.parse(s)}catch(e){}
if(!rows)rows=seed;
const save=()=>{try{localStorage.setItem('uthibak',JSON.stringify(rows))}catch(e){}};
const vol=r=>r.h*r.w*r.d/1e6,f4=x=>x.toFixed(4).replace('.',',');
const key=r=>[r.date,r.lat.toFixed(5),r.lng.toFixed(5),r.h,r.w,r.d].join('|');
const mob=/Mobi|Android/i.test(navigator.userAgent);
const map=L.map('map').setView([46.983,17.698],15);

const esri2=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'© Esri, HERE, Garmin, OpenStreetMap közreműködők'});

const today=new Date().toISOString().slice(0,10);$('d').value=today;
function resetRange(){const ds=rows.map(r=>r.date).sort();$('from').value=ds[0]||today;$('to').value=ds[ds.length-1]||today;
 if(!$('af').value){const u=[...new Set(ds)];if(u.length>1){const k=Math.ceil(u.length/2);$('af').value=u[0];$('at').value=u[k-1];$('bf').value=u[k];$('bt').value=u[u.length-1]}else{$('af').value=$('at').value=$('bf').value=$('bt').value=u[0]||today}}}
resetRange();
function renderSingle(fit){
 const a=$('from').value,b=$('to').value;
 const sel=rows.filter(r=>r.date>=a&&r.date<=b);
 grp.clearLayers();
 const t0=new Date(a).getTime(),span=Math.max(new Date(b).getTime()-t0,1);
 sel.forEach(r=>{
  const t=Math.min(1,Math.max(0,(new Date(r.date).getTime()-t0)/span)),v=vol(r);
  L.circleMarker([r.lat,r.lng],{radius:6+Math.min(14,Math.sqrt(v)*20),color:'#fff',weight:1.5,fillColor:`hsl(${220*(1-t)},80%,50%)`,fillOpacity:.85})
   .bindPopup(`<b>${r.street||''}</b><br>${r.date}<br>${r.h}×${r.w}×${r.d} cm<br>${f4(v)} m³${r.note?'<br>'+r.note:''}`).addTo(grp);
 });
 $('l1').textContent=a;$('l2').textContent=b;$('n').textContent=sel.length;
 $('v').textContent=sel.reduce((s,r)=>s+vol(r),0).toFixed(3).replace('.',',');
 const by={};sel.forEach(r=>{(by[r.date]=by[r.date]||{n:0,v:0});by[r.date].n++;by[r.date].v+=vol(r)});
 let cum=0;const days=Object.keys(by).sort(),mx=Math.max(...days.map(d=>by[d].v),0.0001);
 $('days').innerHTML='<tr><th>Nap</th><th>db</th><th>m³</th><th>Össz. m³</th><th style="width:70px"></th></tr>'+days.map(d=>{cum+=by[d].v;return `<tr><td>${d}</td><td>${by[d].n}</td><td>${f4(by[d].v)}</td><td>${f4(cum)}</td><td><div class="bar" style="width:${by[d].v/mx*100}%"></div></td></tr>`}).join('');
 if(fit&&sel.length)map.fitBounds(L.latLngBounds(sel.map(r=>[r.lat,r.lng])).pad(.1));
}
let mode=1;const AC='#2563eb',BC='#dc2626';
function setMode(m){mode=m;$('p1').style.display=m==1?'':'none';$('p2').style.display=m==2?'':'none';
 $('stats').style.display=$('sumh').style.display=$('dayw').style.display=m==1?'':'none';$('cmpw').style.display=m==2?'':'none';
 $('m1').style.outline=m==1?'2px solid var(--ac)':'';$('m2').style.outline=m==2?'2px solid var(--ac)':'';render(true)}
$('m1').onclick=()=>setMode(1);$('m2').onclick=()=>setMode(2);
['af','at','bf','bt'].forEach(i=>$(i).onchange=()=>render(true));
function render(fit){mode==1?renderSingle(fit):renderCmp(fit)}
const sv=a=>({n:a.length,v:a.reduce((s,r)=>s+vol(r),0),mx:a.reduce((m,r)=>Math.max(m,vol(r)),0)});
const pct=(a,b)=>a?((b-a)/a*100>=0?'+':'')+((b-a)/a*100).toFixed(0)+' %':'–';
const sg=x=>(x>=0?'+':'')+f4(x);
function renderCmp(fit){
 const af=$('af').value,at=$('at').value,bf=$('bf').value,bt=$('bt').value;
 const A=rows.filter(r=>r.date>=af&&r.date<=at),B=rows.filter(r=>r.date>=bf&&r.date<=bt);
 $('warn').textContent=(bf<=at&&af<=bt)?'Figyelem: az A és B időszak átfedi egymást, az átfedő napok úthibái mindkettőben szerepelnek.':'';
 grp.clearLayers();
 const dr=(arr,c,add,nm)=>arr.forEach(r=>{const v=vol(r);L.circleMarker([r.lat,r.lng],{radius:6+add+Math.min(14,Math.sqrt(v)*20),color:'#fff',weight:1.5,fillColor:c,fillOpacity:.7})
  .bindPopup(`<b>${nm} időszak</b><br>${r.street||''}<br>${r.date}<br>${r.h}×${r.w}×${r.d} cm<br>${f4(v)} m³${r.note?'<br>'+r.note:''}`).addTo(grp)});
 dr(A,AC,3,'A');dr(B,BC,0,'B');
 const a=sv(A),b=sv(B);
 const R=(t,x,y,z)=>`<tr><td>${t}</td><td>${x}</td><td>${y}</td><td>${z}</td></tr>`;
 $('cmp').innerHTML=`<tr><th></th><th style="color:${AC}">A</th><th style="color:${BC}">B</th><th>B − A</th></tr>`+
  R('Időszak',af+' – '+at,bf+' – '+bt,'')+R('Úthibák száma',a.n,b.n,(b.n-a.n>=0?'+':'')+(b.n-a.n)+' ('+pct(a.n,b.n)+')')+
  R('Összes térfogat (m³)',f4(a.v),f4(b.v),sg(b.v-a.v)+' ('+pct(a.v,b.v)+')');
 const st={};
 const sk=x=>(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,5)||'(nincs)';
 const add=(r,p)=>{const o=st[sk(r.street)]=st[sk(r.street)]||{a:0,b:0,nm:{}};o[p]+=vol(r);const n=(r.street||'').trim();if(n)o.nm[n]=(o.nm[n]||0)+1};
 const lab=o=>Object.keys(o.nm).sort((x,y)=>o.nm[y]-o.nm[x])[0]||'(nincs)';
 A.forEach(r=>add(r,'a'));B.forEach(r=>add(r,'b'));
 $('st').innerHTML=`<tr><th>Utca</th><th style="color:${AC}">A</th><th style="color:${BC}">B</th><th>B − A</th></tr>`+
  Object.keys(st).sort((x,y)=>(st[y].a+st[y].b)-(st[x].a+st[x].b)).map(k=>R(lab(st[k]),f4(st[k].a),f4(st[k].b),sg(st[k].b-st[k].a))).join('');
 const all=[...A,...B];if(fit&&all.length)map.fitBounds(L.latLngBounds(all.map(r=>[r.lat,r.lng])).pad(.1));
}
$('from').onchange=$('to').onchange=()=>render(true);
function gps(){$('msg').textContent='Helymeghatározás…';
 if(!navigator.geolocation){$('msg').textContent='Nincs GPS, írd be kézzel.';return}
 navigator.geolocation.getCurrentPosition(p=>{$('g').value=p.coords.latitude.toFixed(6)+', '+p.coords.longitude.toFixed(6);$('msg').textContent='Hely rögzítve (±'+Math.round(p.coords.accuracy)+' m).'},
 e=>{$('msg').textContent='Helyzet nem kérhető le ('+e.message+'). Írd be kézzel.'},{enableHighAccuracy:true,timeout:15000});}
$('gps').onclick=gps;
$('add').onclick=()=>{
 const p=($('g').value.match(/-?\d+(?:[.,]\d+)?/g)||[]).map(x=>+x.replace(',','.'));
 const h=+$('h').value,w=+$('w').value,d=+$('m').value;
 if(p.length<2||!h||!w||!d){$('msg').textContent='Hiányzik a hely vagy a méret.';return}
 const r={date:$('d').value||today,lat:p[0],lng:p[1],street:$('u').value,h,w,d,note:$('c').value};
 rows.push(r);save();
 if($('to').value<r.date)$('to').value=r.date;if($('from').value>r.date)$('from').value=r.date;
 ['g','u','h','w','c'].forEach(i=>$(i).value='');
 render(false);$('msg').textContent='Mentve ('+rows.length+' tétel).';if(mob)gps();
};
$('undo').onclick=()=>{if(rows.length&&confirm('Törlöd az utolsó rögzítést?')){rows.pop();save();render(false);$('msg').textContent='Törölve.'}};
$('clr').onclick=()=>{if(confirm('Biztosan törlöd az ÖSSZES adatot ebben a böngészőben?')){rows=[];save();resetRange();render(false)}};
/* CSV */
const norm=s=>(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
function parseCSV(t){
 t=t.replace(/^\ufeff/,'');const l=t.split(/\r?\n/)[0];
 const dl=l.split(';').length>l.split(',').length?';':',';
 const out=[];let row=[],c='',q=false;
